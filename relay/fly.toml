# Fly.io config for Centrifugo relay
# Run: fly launch (in this directory)
# Secrets: fly secrets set HMAC_SECRET_KEY=<hex> API_KEY=<hex>

app = "fidobridge-relay"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
