[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fido-daemon"
version = "0.1.0"
description = "Linux daemon bridging CTAP2/WebAuthn requests to a remote Android phone via E2EE WebSocket relay"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fido2>=1.1",
    "cryptography>=42",
    "centrifuge-python>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
fido-daemon = "fido_daemon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]