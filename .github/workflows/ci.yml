name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      force_bump:
        description: "Override agent (empty = agent decides)"
        type: choice
        options: ["", "major", "minor", "patch"]
        default: ""
      model:
        description: "OpenCode Go model id"
        type: string
        default: "opencode-go/longcat-2.5-preview-free"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  daemon-static:
    name: Daemon static (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-daemon
      - name: Install package (editable + dev extras)
        shell: bash
        run: .venv/bin/pip install -e "linux-fido-daemon[dev]"
      - name: Ruff check
        working-directory: linux-fido-daemon
        run: ../.venv/bin/ruff check .

  daemon-unit:
    name: Daemon unit (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-daemon
      - name: Install package (editable + dev extras)
        shell: bash
        run: .venv/bin/pip install -e "linux-fido-daemon[dev]"
      - name: Run unit tests
        working-directory: linux-fido-daemon
        run: ../.venv/bin/pytest -q

  android-static:
    name: Android lint (lintDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - name: Lint debug build
        working-directory: android-fido-client
        run: ./gradlew lintDebug

  android-unit:
    name: Android unit tests (testDebugUnitTest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - name: Run unit tests
        working-directory: android-fido-client
        run: ./gradlew testDebugUnitTest

  build-daemon:
    name: Package daemon (sdist + wheel)
    runs-on: ubuntu-latest
    needs: [daemon-static, daemon-unit, android-static, android-unit]
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build frontend
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        working-directory: linux-fido-daemon
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-dist
          path: linux-fido-daemon/dist
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  build-android:
    name: Package Android APK (assembleDebug)
    runs-on: ubuntu-latest
    needs: [daemon-static, daemon-unit, android-static, android-unit]
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    env:
      EXPECTED_APK_SIGNER_SHA256: "d1df9ef0eefd2802ab1724991774d8471c71d62bb5802ba2fc14cffb3b95be87"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - name: Assemble debug APK
        working-directory: android-fido-client
        run: ./gradlew assembleDebug
      - name: Verify debug APK signing certificate
        run: |
          set -euo pipefail
          APK="android-fido-client/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          ACTUAL="$("${APKSIGNER}" verify --print-certs "${APK}" \
            | awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}')"
          echo "Signer SHA-256: ${ACTUAL}"
          echo "Expected SHA-256: ${EXPECTED_APK_SIGNER_SHA256}"
          if [ "${ACTUAL}" != "${EXPECTED_APK_SIGNER_SHA256}" ]; then
            echo "::error::APK signer does not match the committed debug keystore"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-fido-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  integration:
    name: Cross-peer integration (live Centrifugo)
    runs-on: ubuntu-latest
    needs: [build-daemon, build-android]
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-daemon
      - uses: ./.github/actions/setup-android
      - uses: actions/download-artifact@v4
        with:
          name: daemon-dist
          path: /tmp/daemon-dist

      - name: Install daemon from built wheel
        run: .venv/bin/pip install /tmp/daemon-dist/*.whl

      - name: Start local Centrifugo v6.9.6
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o centrifugo.tar.gz \
            https://github.com/centrifugal/centrifugo/releases/download/v6.9.6/centrifugo_6.9.6_linux_amd64.tar.gz
          tar -xzf centrifugo.tar.gz
          cat > centrifugo-config.json <<'EOF'
          {
            "client": {
              "allow_anonymous_connect_without_token": true
            },
            "channel": {
              "without_namespace": {
                "allow_subscribe_for_client": true,
                "allow_subscribe_for_anonymous": true,
                "allow_publish_for_client": true,
                "allow_publish_for_anonymous": true,
                "allow_publish_for_subscriber": true
              }
            }
          }
          EOF
          ./centrifugo -p 9000 --config centrifugo-config.json --log.level debug \
            > centrifugo.log 2>&1 &
          echo "CENTRIFUGO_PID=$!" >> "$GITHUB_ENV"
          python3 - <<'PY' || { echo "--- centrifugo.log ---"; cat "$RUNNER_TEMP/centrifugo.log"; exit 1; }
          import socket, time
          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  s = socket.create_connection(("127.0.0.1", 9000), timeout=1)
                  s.close()
                  print("centrifugo ready")
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("centrifugo did not start on port 9000")
          PY

      - name: Generate pairing material
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import os, secrets
          from pathlib import Path
          from fido_daemon.crypto import b64encode
          from fido_daemon.noise import StaticKeyStore

          channel_hex = secrets.token_hex(16)
          key_path = Path("/tmp/daemon_key.bin")
          StaticKeyStore.save(key_path, StaticKeyStore.generate())
          daemon_pub_b64 = b64encode(
              StaticKeyStore.public_key(StaticKeyStore.load(key_path))
          )
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"CHANNEL_HEX={channel_hex}\n")
              fh.write(f"DAEMON_PUBLIC_B64={daemon_pub_b64}\n")
          print(f"channel_hex={channel_hex}")
          print(f"daemon_public_b64={daemon_pub_b64}")
          PY

      - name: Run cross-peer harness (mock-daemon + Android over Centrifugo)
        working-directory: android-fido-client
        env:
          FIDO2_HARNESS: "1"
          FIDO2_CHANNEL_ID: ${{ env.CHANNEL_HEX }}
          FIDO2_DAEMON_PUBLIC_B64: ${{ env.DAEMON_PUBLIC_B64 }}
          FIDO2_RELAY_URL: ws://localhost:9000/connection/websocket
          FIDO2_HARNESS_TIMEOUT: "200"
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/mock_daemon.log"
          FIDO2_CHANNEL_ID="$FIDO2_CHANNEL_ID" \
          FIDO2_STATIC_KEY_PATH="/tmp/daemon_key.bin" \
          FIDO2_RELAY_URL="$FIDO2_RELAY_URL" \
          FIDO2_REQUEST_TIMEOUT=180 \
          timeout 900 ../.venv/bin/python -m mock_daemon all --timeout 180 > "$log" 2>&1 &
          mock_pid=$!
          set +e
          ./gradlew --no-build-cache testDebugUnitTest --tests "com.fidobridge.client.harness.IntegrationHarnessTest"
          gradle_rc=$?
          wait "$mock_pid"
          mock_rc=$?
          set -e
          cat "$log"
          test "$gradle_rc" -eq 0
          test "$mock_rc" -eq 0
          grep -q "get-assertion: OK" "$log"
          grep -q "make-credential: OK" "$log"

      - name: Cleanup background processes
        if: always()
        run: |
          kill "${CENTRIFUGO_PID:-}" 2>/dev/null || true
          true

  release-llm:
    name: LLM decide, tag, build, release
    runs-on: ubuntu-latest
    needs:
      - daemon-static
      - daemon-unit
      - android-static
      - android-unit
      - build-daemon
      - build-android
      - integration
    # Eligible on every green master push; waits on the release environment.
    # workflow_dispatch remains available (force_bump / model inputs).
    if: github.ref == 'refs/heads/master'
    environment:
      name: release
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      EXPECTED_APK_SIGNER_SHA256: "d1df9ef0eefd2802ab1724991774d8471c71d62bb5802ba2fc14cffb3b95be87"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve current version
        id: ver
        run: |
          set -euo pipefail
          name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android-fido-client/app/build.gradle.kts | head -1)
          py=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' linux-fido-daemon/pyproject.toml | head -1)
          if [ -z "$name" ] || [ "$name" != "$py" ]; then
            echo "::error::versionName ($name) must match pyproject version ($py)"
            exit 1
          fi
          echo "version=$name" >> "$GITHUB_OUTPUT"

      - name: Collect commits since last tag
        id: log
        run: |
          set -euo pipefail
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          echo "last_tag=${last_tag:-<none>}" >> "$GITHUB_OUTPUT"
          {
            if [ -n "$last_tag" ]; then
              echo "Range: ${last_tag}..HEAD"
              git log --merges --first-parent --format='%h %s%n%b%n---' "${last_tag}..HEAD"
              echo ""
              echo "Also non-merge commits in range:"
              git log --no-merges --first-parent --format='%h %s' "${last_tag}..HEAD"
            else
              echo "Range: full master history (bootstrap; no tags yet)"
              git log --merges --first-parent --format='%h %s%n%b%n---' origin/master
              echo ""
              echo "Also non-merge commits:"
              git log --no-merges --first-parent --format='%h %s' origin/master
            fi
          } | tee "$RUNNER_TEMP/commit-log.txt"
          head -c 120000 "$RUNNER_TEMP/commit-log.txt" > "$RUNNER_TEMP/commit-log-trimmed.txt"
          echo "log_path=$RUNNER_TEMP/commit-log-trimmed.txt" >> "$GITHUB_OUTPUT"

      - name: Ask OpenCode Go for bump + changelog
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENCODE_GO_API_KEY:-}" ]; then
            echo "::error::Secret OPENCODE_GO_API_KEY is not set"
            exit 1
          fi
          force="${{ inputs.force_bump }}"
          ask_args=(
            --current-version "${{ steps.ver.outputs.version }}"
            --log-file "${{ steps.log.outputs.log_path }}"
            --model "${{ inputs.model }}"
            --out "$RUNNER_TEMP/release-decision.json"
          )
          if [ -n "$force" ]; then
            ask_args+=(--force-bump "$force")
          fi
          python3 scripts/release/ask_bump.py "${ask_args[@]}"
          cat "$RUNNER_TEMP/release-decision.json"

      - name: Bump, tag (fail if exists), silent master push
        id: bump
        run: |
          set -euo pipefail
          python3 scripts/release/bump.py \
            --decision "$RUNNER_TEMP/release-decision.json" \
            --out "$RUNNER_TEMP/release-bump-out.json"
          tag=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tag"])' "$RUNNER_TEMP/release-bump-out.json")
          version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$RUNNER_TEMP/release-bump-out.json")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "## Release"
            echo ""
            echo "- Tag: \`$tag\`"
            echo "- Version: \`$version\`"
            echo "- Pre-bump SHA: \`${GITHUB_SHA}\`"
            echo "- Push order: tag first, then master (silent GITHUB_TOKEN)"
            echo ""
            echo '```json'
            cat "$RUNNER_TEMP/release-decision.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK/Android + Python toolchains
        uses: ./.github/actions/setup-android
      - uses: ./.github/actions/setup-python-daemon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build daemon dist (post-bump)
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          (cd linux-fido-daemon && python -m build)
          mkdir -p dist
          cp linux-fido-daemon/dist/* dist/

      - name: Build Android APK (post-bump) and verify signer
        working-directory: android-fido-client
        run: |
          set -euo pipefail
          ./gradlew assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          ACTUAL="$("${APKSIGNER}" verify --print-certs "${APK}" \
            | awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}')"
          echo "Signer SHA-256: ${ACTUAL}"
          if [ "${ACTUAL}" != "${EXPECTED_APK_SIGNER_SHA256}" ]; then
            echo "::error::APK signer does not match the committed debug keystore"
            exit 1
          fi
          cp "${APK}" ../dist/

      - name: Extract changelog notes for this tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/release-notes.md"
          import os, re, sys
          from pathlib import Path
          tag = os.environ["TAG"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"(?ms)^##\s+{re.escape(tag)}\s*\n(.*?)(?=^##\s+|\Z)", text)
          body = m.group(1).strip() if m else ""
          header = f"## {tag}\n"
          if body:
              sys.stdout.write(header + body + "\n")
          else:
              sys.stdout.write(header + "\nSee commit history for details.\n")
          PY
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.bump.outputs.tag }}"
          echo "Release assets:"
          find dist -type f | sort
          test -n "$(find dist -name '*.apk' | head -1)"
          test -n "$(find dist -name '*.whl' | head -1)"
          test -n "$(find dist -name '*.tar.gz' | head -1)"
          assets=$(find dist -type f \( -name '*.apk' -o -name '*.whl' -o -name '*.tar.gz' \) | sort)
          # shellcheck disable=SC2086
          gh release create "$tag" $assets \
            --title "$tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag
