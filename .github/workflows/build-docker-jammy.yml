name: build-docker-jammy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .github/docker-jammy
          file: .github/docker-jammy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/docker-jammy:latest
            ghcr.io/${{ github.repository }}/docker-jammy:${{ github.sha }}
