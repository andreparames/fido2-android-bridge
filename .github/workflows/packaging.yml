name: packaging

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    paths:
      - 'linux-fido-daemon/**'
      - 'packaging/**'
      - '.github/workflows/packaging.yml'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.image }} (${{ matrix.target }}, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            target: deb
            arch: amd64
            label: debian12
          - image: debian:13
            target: deb
            arch: amd64
            label: debian13
          - image: ubuntu:24.04
            target: deb
            arch: amd64
            label: ubuntu2404
            pybin: python3
          - image: ubuntu:22.04
            target: deb
            arch: amd64
            label: ubuntu2204
            pybin: python3.11
          - image: fedora:41
            target: rpm
            arch: x86_64
            label: fedora41
          - image: rockylinux/rockylinux:10
            target: rpm
            arch: x86_64
            label: rockylinux10
          - image: quay.io/centos/centos:stream10
            target: rpm
            arch: x86_64
            label: centosstream10
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling (deb)
        if: matrix.target == 'deb'
        run: |
          apt-get update -qq
          apt-get install -y -qq debhelper dpkg-dev lintian \
              python3 python3-venv python3-pip python3-cffi gnupg

      - name: Install Python 3.11 (Ubuntu 22.04)
        if: matrix.label == 'ubuntu2204'
        run: |
          apt-get install -y -qq software-properties-common
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update -qq
          apt-get install -y -qq python3.11 python3.11-venv python3.11-dev
          python3.11 -m ensurepip --upgrade
          python3.11 -m pip install --upgrade cffi

      - name: Install tooling (rpm)
        if: matrix.target == 'rpm'
        run: |
          dnf install -y -q epel-release || true
          dnf install -y -q rpm-build python3 python3-pip python3-cffi gnupg2 rpm-sign
          dnf install -y -q rpmlint || true

      - name: Build + lint
        working-directory: packaging
        env:
          PYTHON_BIN: ${{ matrix.pybin }}
        run: ./build.sh ${{ matrix.target }}

      - name: Smoke test (install + run)
        if: matrix.target == 'deb'
        run: |
          apt-get install -y -qq ./packaging/out/deb/*.deb
          /usr/bin/fido-daemon --help >/dev/null
          getent passwd fido-daemon && getent group uhid
          ls -l /var/lib/fido-daemon/config.toml

      - name: Smoke test (install + run)
        if: matrix.target == 'rpm'
        run: |
          dnf install -y -q ./packaging/out/rpm/*.rpm
          /usr/bin/fido-daemon --help >/dev/null
          getent passwd fido-daemon && getent group uhid
          ls -l /var/lib/fido-daemon/config.toml

      - name: Import signing key
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.RELEASE_GPG_PASSPHRASE }}

      - name: Sign (deb)
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && matrix.target == 'deb'
        run: |
          apt-get install -y -qq debsigs
          for deb in ./packaging/out/deb/*.deb; do debsigs --sign=origin "$deb"; done
          # debsigs --verify is unimplemented on some distros (Debian 12/Ubuntu)
          for deb in ./packaging/out/deb/*.deb; do
            debsigs --verify "$deb" 2>/dev/null || echo "note: debsigs --verify unsupported here; signature embedded"
          done

      - name: Sign (rpm)
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && matrix.target == 'rpm'
        run: |
          for rpm in ./packaging/out/rpm/*.rpm; do
            rpmsign --define "_gpg_name 65E4D9A0F8F86048" --define "_signature gpg" --addsign "$rpm"
          done
          gpg --batch --armor --export 65E4D9A0F8F86048 > /tmp/fido-daemon-pub.asc
          rpm --import /tmp/fido-daemon-pub.asc 2>/dev/null || true
          for rpm in ./packaging/out/rpm/*.rpm; do rpm -K "$rpm"; done

      - uses: actions/upload-artifact@v4
        with:
          name: fido-daemon-${{ matrix.label }}-${{ matrix.arch }}
          path: |
            packaging/out/${{ matrix.target }}
            packaging/KEYS
          if-no-files-found: error

  publish:
    name: Publish apt/rpm repos (GitHub Pages)
    needs: [build]
    if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Install repo tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c

      - name: Import signing key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.RELEASE_GPG_PASSPHRASE }}

      - name: Assemble repo tree
        run: |
          packaging/scripts/build-repo-tree.sh \
            --keyid 65E4D9A0F8F86048 \
            --apt bookworm dist/fido-daemon-debian12-amd64/out/deb \
            --apt trixie   dist/fido-daemon-debian13-amd64/out/deb \
            --apt noble    dist/fido-daemon-ubuntu2404-amd64/out/deb \
            --apt jammy    dist/fido-daemon-ubuntu2204-amd64/out/deb \
            --rpm fedora/x86_64     dist/fido-daemon-fedora41-x86_64/out/rpm \
            --rpm rockylinux/x86_64 dist/fido-daemon-rockylinux10-x86_64/out/rpm \
            --rpm centos/x86_64     dist/fido-daemon-centosstream10-x86_64/out/rpm \
            site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4