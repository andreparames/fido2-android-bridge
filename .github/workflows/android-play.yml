name: CI (play flavor)

# Run the play-variant checks only when files that contain play-specific code
# change: the play source set and the shared files that branch on the flavor
# conditionals (PLAY_BILLING_REQUIRED / MANAGED_RELAY), plus the flavor build
# config. The oss jobs in ci.yml already compile and test the shared main/test
# code, so other changes do not need a play build.
on:
  pull_request:
    paths:
      - ".github/workflows/android-play.yml"
      - "android-fido-client/app/src/play/**"
      - "android-fido-client/app/src/testPlay/**"
      - "android-fido-client/app/src/main/java/com/fidobridge/client/di/DataModule.kt"
      - "android-fido-client/app/src/main/java/com/fidobridge/client/ui/AppSurface.kt"
      - "android-fido-client/app/src/main/java/com/fidobridge/client/ui/FidoBridgeApp.kt"
      - "android-fido-client/app/src/main/java/com/fidobridge/client/ui/subscribe/SubscribeScreen.kt"
      - "android-fido-client/app/build.gradle.kts"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/android-play.yml"
      - "android-fido-client/app/src/play/**"
      - "android-fido-client/app/src/testPlay/**"
      - "android-fido-client/app/src/main/java/com/fidobridge/client/di/DataModule.kt"
      - "android-fido-client/app/src/main/java/com/fidobridge/client/ui/AppSurface.kt"
      - "android-fido-client/app/src/main/java/com/fidobridge/client/ui/FidoBridgeApp.kt"
      - "android-fido-client/app/src/main/java/com/fidobridge/client/ui/subscribe/SubscribeScreen.kt"
      - "android-fido-client/app/build.gradle.kts"
  workflow_dispatch:

concurrency:
  group: ci-android-play-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-static-play:
    name: Android lint play (lintPlayDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - name: Lint play debug build
        working-directory: android-fido-client
        run: ./gradlew lintPlayDebug

  android-unit-play:
    name: Android unit tests play (testPlayDebugUnitTest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - name: Run play unit tests
        working-directory: android-fido-client
        run: ./gradlew testPlayDebugUnitTest

  build-android-play:
    name: Package Android APK play (assemblePlayDebug)
    runs-on: ubuntu-latest
    needs: [android-static-play, android-unit-play]
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    env:
      EXPECTED_APK_SIGNER_SHA256: "d1df9ef0eefd2802ab1724991774d8471c71d62bb5802ba2fc14cffb3b95be87"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - name: Assemble play debug APK
        working-directory: android-fido-client
        run: ./gradlew assemblePlayDebug
      - name: Verify debug APK signing certificate
        run: |
          set -euo pipefail
          APK="android-fido-client/app/build/outputs/apk/play/debug/app-play-debug.apk"
          APKSIGNER="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          ACTUAL="$("${APKSIGNER}" verify --print-certs "${APK}" \
            | awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}')"
          echo "Signer SHA-256: ${ACTUAL}"
          echo "Expected SHA-256: ${EXPECTED_APK_SIGNER_SHA256}"
          if [ "${ACTUAL}" != "${EXPECTED_APK_SIGNER_SHA256}" ]; then
            echo "::error::APK signer does not match the committed debug keystore"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-play
          path: android-fido-client/app/build/outputs/apk/play/debug/app-play-debug.apk
          if-no-files-found: error
          retention-days: 7
          overwrite: true
