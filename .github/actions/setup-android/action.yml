name: Set up Android toolchain
description: JDK 17 + Gradle wrapper validation/cache + Android SDK (platform 34, build-tools) with caching

runs:
  using: composite
  steps:
    - uses: gradle/actions/wrapper-validation@v3

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - uses: gradle/actions/setup-gradle@v4

    - uses: android-actions/setup-android@v4
      with:
        packages: "platform-tools platforms;android-34 build-tools;34.0.0"

    - name: Export Android SDK locations
      shell: bash
      run: |
        sdk_root="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
        echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"